<html lang="es">

<title>Estudio de mini series IA</title>
<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{font-size:15px;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:2px}.app{min-height:100vh}.shell{display:grid;grid-template-columns:242px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;align-items:center;gap:11px;padding:2px 10px}.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--blue);color:white;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.04em}.brand-name{font-weight:700;letter-spacing:-.02em;font-size:15px}.brand-sub{font-size:11px;color:var(--muted);margin-top:1px}.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:0 11px;margin:0 0 7px;font-weight:700}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:10px 12px;border-radius:9px;display:flex;align-items:center;gap:11px;font-size:14px}.nav button:hover{background:var(--soft);color:var(--text)}.nav button.active{color:var(--blue);background:var(--blue-soft);font-weight:650}.nav-icon{width:20px;text-align:center;font-size:15px}.sidebar-bottom{margin-top:auto}.status-card{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--bg)}.status-top{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650}.dot{width:8px;height:8px;border-radius:50%;background:#d18b43}.status-card p{font-size:12px;line-height:1.45;color:var(--muted);margin:8px 0 0}.main{min-width:0}.topbar{height:72px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;justify-content:space-between;align-items ansparent 106px),linear-gradient(135deg,var(--blue-soft),var(--surface) 65%);padding:26px;min-height:190px;position:relative;overflow:hidden}.hero-card>*{position:relative;z-index:1}.hero-card h2{font-size:23px;max-width:600px;margin-bottom:8px}.hero-card p{color:var(--muted);margin:0;max-width:620px}.hero-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:var(--soft);border-radius:11px;padding:14px}.stat strong{display:block;font-size:20px;letter-spacing:-.03em}.stat span{color:var(--muted);font-size:12px}.progress-list{display:grid;gap:16px}.progress-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px}.step-index{width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--muted);display:grid;place-items:center;font-size:11px;font-weight:700}.step-index.done{background:var(--green-soft);color:var(--green)}.progress-title{font-size:13px;font-weight:600}.progress-desc{font-size:11px;color:var(--muted)}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:var(--soft);color:var(--muted);font-size:11px;font-weight:650;white-space:nowrap}.tag.blue{background:var(--blue-soft);color:var(--blue)}.tag.green{background:var(--green-soft);color:var(--green)}.tag.orange{background:var(--orange-soft);color:var(--orange)}.section-gap{margin-top:18px}.callout{border-radius:11px;padding:13px 15px;background:var(--orange-soft);color:var(--orange);font-size:12px;display:flex;gap:10px;align-items:flex-start}.callout strong{display:block;margin-bottom:2px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:grid;gap:6px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:650}.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 11px;width:100%;min-height:42px}.field textarea{min-height:96px;resize:vertical}.field input::placeholder,.field textarea::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.hint{font-size:11px;color:var(--muted);margin-top:1px}.ai-inline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.ai-inline .btn{margin-left:auto}.choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.choice{border:1px solid var(--line);border-radius:11px;padding:13px;background:var(--surface);text-align:left;color:var(--text);min-height:100px}.choice:hover{border-color:var(--blue)}.choice.selected{border-color:var(--blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 14%,transparent);background:var(--blue-soft)}.choice strong{display:block;font-size:13px;margin-bottom:5px}.choice span{font-size:11px;color:var(--muted);line-height:1.4;display:block}.character-list,.episode-list,.scene-list{display:grid;gap:11px}.character-card,.episode-card,.scene-card{border:1px solid var(--line);border-radius:11px;padding:14px;background:var(--surface)}.character-top,.episode-top,.scene-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.character-name,.episode-name,.scene-name{font-weight:650;font-size:14px}.character-role,.episode-meta{font-size:12px;color:var(--muted);margin-top:3px}.character-desc,.scene-desc{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.5}.episode-card{cursor:pointer}.episode-card:hover{border-color:color-mix(in srgb,var(--blue) 55%,var(--line))}.episode-card.selected{border-color:var(--blue);background:var(--blue-soft)}.episode-main{display:flex;gap:12px;align-items:center}.episode-num{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--soft);font-weight:700;color:var(--blue);font-size:12px;flex:0 0 auto}.episode-card.selected .episode-num{background:var(--surface)}.episode-content{min-width:0;flex:1}.episode-summary{color:var(--muted);font-size:12px;margin:10px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.episode-layout{display:grid;grid-template-columns:minmax(250px,.85fr) minmax(0,1.4fr);gap:18px}.scene-number{font-size:11px;color:var(--blue);font-weight:750;letter-spacing:.04em;text-transform:uppercase}.scene-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.divider{border:0;border-top:1px solid var(--line);margin:18px 0}.empty{padding:28px 18px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:5px}.empty p{font-size:12px;margin:0 0 14px}.prompt-box{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:14px;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55;overflow-wrap:anywhere;max-height:330px;overflow:auto}.export-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.export-card{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}.export-card p{font-size:12px;color:var(--muted);margin:0;flex:1}.integration-row{display:grid;grid-template-columns:minmax(120px,.8fr) minmax(0,1fr) auto;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.integration-row:last-child{border-bottom:0}.integration-title{font-size:13px;font-weight:650}.integration-type{font-size:11px;color:var(--muted)}.integration-row input{min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--surface);color:var(--text)}.mobile-top{display:none}.mobile-menu-toggle{display:none}.mobile-menu{display:none}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:11px 15px;border-radius:10px;font-size:13px;box-shadow:0 6px 22px rgba(0,0,0,.2);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.footer-note{font-size:11px;color:var(--muted);margin-top:18px}.hidden{display:none!important}
@media(max-width:900px){.shell{grid-template-columns:200px minmax(0,1fr)}.content{padding:28px 22px 48px}.topbar{padding:0 22px}.grid.two{grid-template-columns:1fr}.episode-layout{grid-template-columns:1fr}.grid.three{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.shell{display:block}.sidebar{display:none}.topbar{height:58px;padding:0 16px}.btn,.btn.small{min-height:44px}.mobile-top{display:flex;align-items:center;gap:9px}.mobile-brand{font-size:13px;font-weight:700}.mobile-menu-toggle{display:inline-flex}.mobile-menu:not(.hidden){display:grid;position:fixed;top:66px;left:12px;right:12px;z-index:12;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14)}.mobile-menu button{border:0;border-radius:8px;background:transparent;color:var(--text);text-align:left;padding:11px 12px;font-size:13px;min-height:44px}.mobile-menu button:hover,.mobile-menu button.active{background:var(--blue-soft);color:var(--blue);font-weight:650}.crumb{display:none}.content{padding:24px 16px 40px}.page-head{display:block}.page-head h1{font-size:24px}.page-head>.btn{margin-top:16px}.page-head .top-actions{margin-top:14px}.save-note{display:none}.api-chip{display:none}.logout-desktop{display:none}.grid.three{grid-template-columns:1fr}.field-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.choice-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{padding:11px}.stat strong{font-size:17px}.stat span{font-size:10px}.hero-card{padding:21px}.hero-card h2{font-size:20px}.export-grid{grid-template-columns:1fr}.integration-row{grid-template-columns:1fr;gap:7px}.integration-row input{width:100%}.integration-row .tag{justify-self:start}.episode-layout{gap:12px}.card{padding:16px}.top-actions{gap:7px}.topbar>.top-actions .btn{min-height:44px;padding:6px 9px;font-size:12px}.crumb{font-size:12px}}
</style>
</head>
<body>
<div class="app"><div class="shell">
<aside class="sidebar" aria-label="Navegación principal">
  <div class="brand"><div class="brand-mark" aria-hidden="true">S</div><div><div class="brand-name">Estudio IA</div><div class="brand-sub">Producción de mini series</div></div></div>
  <div><p class="nav-label">Proyecto</p><nav class="nav" id="nav">
    <button class="active" data-page="overview"><span class="nav-icon" aria-hidden="true">◫</span>Resumen</button>
    <button data-page="bible"><span class="nav-icon" aria-hidden="true">▤</span>Biblia de serie</button>
    <button data-page="episodes"><span class="nav-icon" aria-hidden="true">▦</span>Episodios</button>
    <button data-page="production"><span class="nav-icon" aria-hidden="true">◉</span>Producción</button>
    <button data-page="connections"><span class="nav-icon" aria-hidden="true">⌘</span>Proveedores IA</button>
    <button data-page="export"><span class="nav-icon" aria-hidden="true">⇧</span>Exportar</button>
  </nav></div>
  <div class="sidebar-bottom"><div class="status-card"><div class="status-top"><span class="dot"></span>MVP local</div><p>La clave se mantiene en el servidor local. Por ahora se generan premisas y sinopsis; no clips ni voces.</p></div></div>
</aside>
<main class="main">
  <header class="topbar"><div class="mobile-top"><div class="brand-mark" aria-hidden="true">S</div><span class="mobile-brand">Estudio IA</span><button class="btn small mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-expanded="false" aria-controls="mobileMenu">Menú</button></div><div class="crumb" id="breadcrumb"><strong>Proyecto</strong> / Resumen</div><div class="top-actions"><span id="apiChip" class="tag orange api-chip">IA: requiere servidor</span><span class="save-note"><span class="save-dot"></span>Guardado en este dispositivo</span><button class="btn small" id="exportQuick" type="button">Exportar brief</button><button class="btn small logout-desktop" data-logout type="button">Salir</button></div></header>
  <nav class="mobile-menu hidden" id="mobileMenu" aria-label="Navegación móvil"><button data-page="overview">Resumen</button><button data-page="bible">Biblia de serie</button><button data-page="episodes">Episodios</button><button data-page="production">Producción</button><button data-page="connections">Proveedores IA</button><button data-page="export">Exportar</button><button data-logout>Cerrar sesión</button></nav>
  <section class="content" id="view" aria-live="polite"></section>
</main>
</div></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
const KEY='estudio-mini-series-ia-v1';
const blank=()=>({projectName:'Mi mini serie',clientName:'',mode:'full_ai',genre:'',platform:'',audience:'',visualStyle:'',logline:'',characters:[],episodes:[],activeEpisodeId:null,providers:{text:'',image:'',video:'',voice:''},updatedAt:null});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||blank()}catch{data=blank()}
let page='overview',toastTimer;
const view=document.getElementById('view');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{data.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(data));};
const showToast=(msg)=>{const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3800)};
async function requestAI(task,context){const res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task,context})});let body={};try{body=await res.json()}catch{}if(!res.ok)throw new Error(body.error||`Solicitud fallida (${res.status})`);return String(body.text||'').trim()}
async function runAIButton(button,task,context,onResult){const label=button.textContent;button.disabled=true;button.textContent='Generando…';try{const text=await requestAI(task,context);onResult(text);showToast('Propuesta lista. Revísala antes de guardar.')}catch(err){const m=String(err.message||err);showToast(m.includes('Failed to fetch')||m.includes('NetworkError')?'No conecta con el backend local. Abre la app desde http://127.0.0.1:3000':`No se pudo generar: ${m}`)}finally{button.disabled=false;button.textContent=label}}
const modeName=()=>({full_ai:'Todo generado con IA',hybrid:'Producción híbrida',assist:'Edición asistida'}[data.mode]||'Todo generado con IA');
const completion=()=>{let n=0;if(data.projectName&&data.projectName!=='Mi mini serie')n++;if(data.genre)n++;if(data.logline)n++;if(data.characters.length)n++;if(data.episodes.length)n++;return n};
function setPage(p){page=p;document.querySelectorAll('#nav button, #mobileMenu button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('breadcrumb').innerHTML='<strong>Proyecto</strong> / '+({overview:'Resumen',bible:'Biblia de serie',episodes:'Episodios',production:'Producción',connections:'Proveedores IA',export:'Exportar'}[p]||'Resumen');render();window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
function pageHead(title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">Estudio de mini series IA</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function render(){if(page==='overview')renderOverview();else if(page==='bible')renderBible();else if(page==='episodes')renderEpisodes();else if(page==='production')renderProduction();else if(page==='connections')renderConnections();else renderExport();}
function renderOverview(){const pct=Math.min(100,Math.round(completion()/5*100));const active=data.episodes.find(x=>x.id===data.activeEpisodeId)||data.episodes[0];view.innerHTML=pageHead('Tu sala de producción','Organiza la serie, define la continuidad y prepara cada episodio para generarlo con los proveedores que elijas.',`<button class="btn primary" data-go="bible">Configurar serie <span aria-hidden="true">→</span></button>`)+`<div class="grid two"><div><div class="card hero-card"><div class="eyebrow">PROYECTO ACTUAL</div><h2>${esc(data.projectName||'Mi mini serie')}</h2><p>${esc(data.logline||'Define la premisa y el estilo para empezar a construir una serie consistente, episodio por episodio.')}</p><div class="hero-actions"><button class="btn primary" data-go="episodes">Ir a episodios</button><button class="btn" data-go="bible">Editar biblia</button><span class="tag blue">${esc(modeName())}</span></div></div><div class="stats"><div class="stat"><strong>${data.episodes.length}</strong><span>Episodios</span></div><div class="stat"><strong>${data.characters.length}</strong><span>Personajes</span></div><div class="stat"><strong>${pct}%</strong><span>Configuración</span></div></div><div class="card section-gap"><div class="card-head"><div><h2>Próximo paso</h2><div class="small-text">Construye un episodio y después prepara sus escenas.</div></div><span class="tag orange">MVP</span></div>${active?`<div class="episode-main"><div class="episode-num">${esc(active.number||'01')}</div><div class="episode-content"><div class="episode-name">${esc(active.title)}</div><div class="episode-meta">${esc(active.duration||'Duración por definir')} · ${active.scenes?.length||0} escenas</div></div></div><div class="hero-actions"><button class="btn small primary" data-go="production">Continuar producción</button></div>`:`<div class="empty"><strong>Aún no hay episodios</strong><p>Crea el episodio piloto para pasar de la idea a las escenas.</p><button class="btn small primary" data-go="episodes">Crear episodio piloto</button></div>`}</div></div><div class="card"><div class="card-head"><div><h2>Ruta de producción</h2><div class="small-text">Una estructura adaptable a cada cliente.</div></div><span class="tag">${pct}% listo</span></div><div class="progress-list"><div class="progress-row"><span class="step-index ${data.genre&&data.logline?'done':''}">${data.genre&&data.logline?'✓':'1'}</span><div><div class="progress-title">Biblia de serie</div><div class="progress-desc">Premisa, tono, plataforma y modo de producción</div></div><button class="btn small ghost" data-go="bible">Abrir</button></div><div class="progress-row"><span class="step-index ${data.characters.length?'done':''}">${data.characters.length?'✓':'2'}</span><div><div class="progress-title">Personajes y continuidad</div><div class="progress-desc">Rasgos visuales y voz de cada personaje</div></div><button class="btn small ghost" data-go="bible">Abrir</button></div><div class="progress-row"><span class="step-index ${data.episodes.length?'done':''}">${data.episodes.length?'✓':'3'}</span><div><div class="progress-title">Episodios y escenas</div><div class="progress-desc">Guion, plan visual y desglose por escena</div></div><button class="btn small ghost" data-go="episodes">Abrir</button></div><div class="progress-row"><span class="step-index">4</span><div><div class="progress-title">Generación y revisión</div><div class="progress-desc">Conectar proveedores y aprobar el montaje</div></div><button class="btn small ghost" data-go="connections">Ver</button></div></div><hr class="divider"><div class="callout"><span aria-hidden="true">!</span><div><strong>El video aún no está conectado</strong>La integración de texto y voz se activa con el backend. La generación de clips se añadirá por separado.</div></div></div></div>`;bindCommon();}

function makePrompt(s){const chars=data.characters.map(c=>`${c.name}: ${c.description||c.role}`).join('\n')||'Sin fichas de personajes definidas.';return `PROYECTO: ${data.projectName}\nCLIENTE: ${data.clientName||'No especificado'}\nMODO: ${modeName()}\nGÉNERO: ${data.genre||'Por definir'}\nESTILO VISUAL: ${data.visualStyle||'Por definir'}\nPREMISA: ${data.logline||'Por definir'}\n\nCONTINUIDAD DE PERSONAJES:\n${chars}\n\nEPISODIO: ${activeEpisode()?.title||''}\nESCENA: ${s.title}\nDURACIÓN OBJETIVO: ${s.duration||'Por definir'}\nLUGAR / MOMENTO: ${s.location||'Por definir'}\nACCIÓN Y ENCUADRE: ${s.visual||'Por definir'}\nDIÁLOGO / SONIDO: ${s.audio||'Sin diálogo especificado'}\n\nINSTRUCCIONES:\nGenera una propuesta visual coherente con la biblia y el modo de producción. Mantén consistentes rostros, vestuario, utilería y tono. No inventes detalles que contradigan la continuidad. Devuelve: (1) prompt visual, (2) movimiento de cámara, (3) notas de continuidad, (4) audio/voz sugeridos. No publiques ni generes medios sin aprobación humana.`}
function showPrompt(s){const area=document.getElementById('promptArea');area.classList.remove('hidden');area.innerHTML=`<div class="card-head"><div><h2>Prompt de producción · ${esc(s.title)}</h2><div class="small-text">Editable y listo para copiar a un proveedor compatible.</div></div><button class="btn small" id="copyPrompt">Copiar prompt</button><button class=\"btn small primary\" id=\"voiceBtn\">Generar voz</button></div><div class="prompt-box" id="promptText">${esc(makePrompt(s))}</div><div id=\"voiceArea\" class=\"section-gap\"></div><div class="callout section-gap"><span aria-hidden="true">i</span><div><strong>Solo es una plantilla de prompt</strong>La generación de imagen y video se activará cuando se conecten APIs compatibles. La voz ya funciona con ElevenLabs desde el diálogo de la escena.</div></div>`;document.getElementById('copyPrompt').onclick=()=>copyText(makePrompt(s),'Prompt copiado');document.getElementById('voiceBtn').onclick=async()=>{const va=document.getElementById('voiceArea');const text=(s.audio||'').trim();if(!text){va.innerHTML=`<div class=\"callout\"><span aria-hidden=\"true\">!</span><div>Esta escena no tiene diálogo o narración. Añade texto en «Diálogo / voz / sonido» para generar la voz.</div></div>`;return}va.innerHTML='<div class=\"small-text\">Generando voz…</div>';try{const r=await fetch('/api/voice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok){let m='No se pudo generar la voz.';try{const b=await r.json();m=b.error||m}catch{}va.innerHTML=`<div class=\"callout\"><span aria-hidden=\"true\">!</span><div>${esc(m)}</div></div>`;return}const blob=await r.blob();const u=URL.createObjectURL(blob);va.innerHTML=`<audio controls src=\"${u}\" style=\"width:100%\"></audio>`}catch{va.innerHTML='<div class=\"callout\"><span aria-hidden=\"true\">!</span><div>No se pudo conectar con el servidor de voz.</div></div>'}}}
function renderConnections(){view.innerHTML=pageHead('Proveedores de IA','Prepara una arquitectura flexible. La página no guarda claves; el backend maneja las llamadas de texto (Gemini) y voz (ElevenLabs). El video sigue pendiente.')+`<div class="grid two"><div class="card"><div class="card-head"><div><h2>Qué proveedor elegir</h2><div class="small-text">Puedes cambiar proveedores por cliente o etapa.</div></div><span class="tag orange">Pendiente</span></div>${[['text','Texto y guion','LLM para biblia, escaleta, guiones y prompts.'],['image','Imagen / referencias','Diseño de personajes, escenarios y referencias visuales.'],['video','Generación de video','Clips de escenas y movimiento de cámara.'],['voice','Voz y audio','Narración, diálogo, doblaje y ambiente.']].map(([k,t,d])=>`<div class="integration-row"><div><div class="integration-title">${t}</div><div class="integration-type">${d}</div></div><input data-provider="${k}" aria-label="Proveedor preferido para ${t}" value="${esc(data.providers[k]||'')}" placeholder="Nombre del proveedor (opcional)"><span class="tag">Sin conectar</span></div>`).join('')}<div class="form-actions"><button class="btn primary" id="saveProviders">Guardar preferencias</button></div></div><div><div class="card"><div class="card-head"><h2>Conexión segura</h2><span class="tag blue">Siguiente fase</span></div><p class="small-text">Para habilitar generación real, cada proveedor necesita una integración específica. La clave API debe guardarse en un servidor seguro, nunca en esta página ni en el navegador.</p><ol class="small-text" style="padding-left:19px;display:grid;gap:8px"><li>Elegir proveedores para texto, imagen/video y voz.</li><li>Confirmar que sus APIs permiten el uso comercial y los formatos necesarios.</li><li>Crear un backend que guarde secretos y llame a cada API.</li><li>Añadir límites de costo, reintentos y aprobación antes de renderizar.</li></ol></div><div class="card section-gap"><div class="card-head"><h2>Diseño intercambiable</h2></div><p class="small-text">La aplicación debe hablar con adaptadores separados. Así se puede cambiar el modelo de texto sin rehacer el guion, o cambiar el generador de clips sin perder la biblia ni las escenas.</p><div class="callout"><span aria-hidden="true">!</span><div><strong>No pegues una API key aquí</strong>Cuando elijamos proveedor, conectaremos las credenciales mediante configuración del servidor.</div></div></div></div></div>`;bindCommon();document.getElementById('saveProviders').onclick=()=>{document.querySelectorAll('[data-provider]').forEach(i=>data.providers[i.dataset.provider]=i.value.trim());save();showToast('Preferencias guardadas localmente')}}
function buildMarkdown(){return `# ${data.projectName||'Mi mini serie'}\n\n## Proyecto\n- Cliente: ${data.clientName||'Sin definir'}\n- Modo: ${modeName()}\n- Género: ${data.genre||'Sin definir'}\n- Plataforma: ${data.platform||'Sin definir'}\n- Audiencia: ${data.audience||'Sin definir'}\n- Estilo: ${data.visualStyle||'Sin definir'}\n\n## Premisa\n${data.logline||'Pendiente'}\n\n## Personajes\n${data.characters.length?data.characters.map(c=>`### ${c.name}\n- Rol: ${c.role||'Sin definir'}\n- Continuidad: ${c.description||'Pendiente'}`).join('\n\n'):'Pendiente'}\n\n## Episodios\n${data.episodes.length?data.episodes.map((ep,i)=>`### ${i+1}. ${ep.title}\n- Duración: ${ep.duration||'Por definir'}\n- Estado: ${ep.status||'Idea'}\n- Sinopsis: ${ep.summary||'Pendiente'}\n${ep.scenes?.length?ep.scenes.map((s,j)=>`\n#### Escena ${j+1}: ${s.title}\n- Duración: ${s.duration||'Por definir'}\n- Lugar: ${s.location||'Por definir'}\n- Acción: ${s.visual||'Pendiente'}\n- Audio: ${s.audio||'Pendiente'}`).join('\n'):''}`).join('\n\n'):'Pendiente'}\n\n## Proveedores preferidos\n- Texto: ${data.providers.text||'Por elegir'}\n- Imagen: ${data.providers.image||'Por elegir'}\n- Video: ${data.providers.video||'Por elegir'}\n- Voz: ${data.providers.voice||'Por elegir'}\n\n> Borrador de trabajo. Revisar derechos, continuidad y aprobación humana antes de publicar.\n`}
function renderExport(){view.innerHTML=pageHead('Exportar proyecto','Lleva la biblia y el plan de producción a otro sistema o compártelos para revisión.')+`<div class="grid two"><div class="card"><div class="card-head"><div><h2>Paquete del proyecto</h2><div class="small-text">${esc(data.projectName||'Mi mini serie')} · ${data.episodes.length} episodios · ${data.characters.length} personajes</div></div><span class="tag green">Listo para exportar</span></div><div class="export-grid"><div class="export-card"><strong>Brief en Markdown</strong><p>Legible para revisión y fácil de compartir con el equipo creativo.</p><button class="btn small primary" id="downloadMd">Descargar .md</button></div><div class="export-card"><strong>Datos JSON</strong><p>Útil para migrar el proyecto o conectarlo a un backend después.</p><button class="btn small" id="downloadJson">Descargar .json</button></div><div class="export-card"><strong>Copiar brief</strong><p>Copia la biblia y el estado de episodios al portapapeles.</p><button class="btn small" id="copyBrief">Copiar texto</button></div><div class="export-card"><strong>Respaldo local</strong><p>Guarda una copia de los datos del prototipo.</p><button class="btn small" id="backupJson">Crear respaldo</button></div></div></div><div class="card"><div class="card-head"><h2>Vista previa del brief</h2><span class="tag">Markdown</span></div><div class="prompt-box" style="max-height:560px">${esc(buildMarkdown())}</div><div class="footer-note">El archivo se genera en tu dispositivo. Nada se envía a un servidor desde este prototipo.</div></div></div>`;bindCommon();document.getElementById('downloadMd').onclick=()=>download('brief-mini-serie.md',buildMarkdown(),'text/markdown');document.getElementById('downloadJson').onclick=()=>download('proyecto-mini-serie.json',JSON.stringify(data,null,2),'application/json');document.getElementById('backupJson').onclick=()=>download('respaldo-mini-serie.json',JSON.stringify(data,null,2),'application/json');document.getElementById('copyBrief').onclick=()=>copyText(buildMarkdown(),'Brief copiado')}
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href);showToast('Archivo preparado para descargar')}
async function copyText(text,msg){try{await navigator.clipboard.writeText(text);showToast(msg)}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast(msg)}}
function bindCommon(){document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.go)));}
document.getElementById('exportQuick').addEventListener('click',()=>{setPage('export')});
const mobileMenu=document.getElementById('mobileMenu');const mobileMenuToggle=document.getElementById('mobileMenuToggle');mobileMenuToggle.addEventListener('click',()=>{const open=mobileMenu.classList.contains('hidden');mobileMenu.classList.toggle('hidden',!open);mobileMenuToggle.setAttribute('aria-expanded',String(open))});async function logoutApp(){try{await fetch('/api/logout',{method:'POST'});const state=await fetch('/api/session').then(r=>r.json());if(state.loginRequired)location.replace('/login');else showToast('Esta instalación no tiene contraseña de acceso configurada.')}catch{showToast('No se pudo cerrar la sesión')}}document.querySelectorAll('.logout-desktop').forEach(b=>b.addEventListener('click',logoutApp));mobileMenu.addEventListener('click',e=>{const logout=e.target.closest('[data-logout]');if(logout){mobileMenu.classList.add('hidden');mobileMenuToggle.setAttribute('aria-expanded','false');logoutApp();return}const b=e.target.closest('[data-page]');if(b){setPage(b.dataset.page);mobileMenu.classList.add('hidden');mobileMenuToggle.setAttribute('aria-expanded','false')}});document.addEventListener('click',e=>{if(!e.target.closest('#mobileMenu')&&!e.target.closest('#mobileMenuToggle')){mobileMenu.classList.add('hidden');mobileMenuToggle.setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){mobileMenu.classList.add('hidden');mobileMenuToggle.setAttribute('aria-expanded','false')}});
async function checkAIStatus(){const chip=document.getElementById('apiChip');try{const res=await fetch('/api/health');const info=await res.json();if(info.configured){chip.className='tag green api-chip';chip.textContent=`IA conectada · ${info.model}`}else{chip.className='tag orange api-chip';chip.textContent='Falta clave en .env'}}catch{chip.className='tag orange api-chip';chip.textContent='Servidor local apagado'}}
render();if(location.protocol!=='file:'){checkAIStatus();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{})}
})();
</script>
</body>
</html>
