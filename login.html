<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#216bb5"><title>Acceso · Estudio IA</title>
<style>
:root{color-scheme:light dark;--bg:#f7f8fa;--surface:#fff;--text:#24272c;--muted:#6b7280;--line:#e4e7ec;--blue:#216bb5;--soft:#e9f2fc;--red:#b8423b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif} @media(prefers-color-scheme:dark){:root{--bg:#17191d;--surface:#202329;--text:#f3f4f6;--muted:#a6adb8;--line:#383d46;--blue:#72b5ff;--soft:#202f40;--red:#f18c84}button{color:#172433}.mark{color:#172433}}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);padding:20px}.card{width:min(100%,420px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;font-weight:800}.title{font-size:23px;font-weight:750;letter-spacing:-.03em;margin:0 0 7px}.sub{color:var(--muted);font-size:14px;margin:0 0 22px;line-height:1.5}label{font-size:13px;font-weight:650;display:block;margin-bottom:7px}input{width:100%;height:46px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}input:focus{outline:3px solid color-mix(in srgb,var(--blue) 35%,transparent);outline-offset:2px}button{height:46px;width:100%;margin-top:14px;border:0;border-radius:9px;background:var(--blue);color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.error{min-height:20px;color:var(--red);font-size:13px;margin-top:10px}.note{border-radius:10px;background:var(--soft);padding:12px;color:var(--muted);font-size:12px;line-height:1.5;margin-top:18px}
</style>
</head>
<body><main class="card"><div class="brand"><div class="mark" aria-hidden="true">S</div><div><strong>Estudio IA</strong><div style="color:var(--muted);font-size:12px">Producción de mini series</div></div></div><h1 class="title">Acceso privado</h1><p class="sub">Introduce la contraseña configurada para este estudio. La contraseña no se guarda en el navegador.</p><form id="login"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">Entrar</button><div id="error" class="error" role="alert" aria-live="polite"></div></form><div class="note">La conexión con el modelo se realiza desde el servidor. No introduzcas aquí una API key.</div></main>
<script>
const form=document.getElementById('login'),button=document.getElementById('submit'),error=document.getElementById('error');form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';button.disabled=true;button.textContent='Verificando…';try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo iniciar sesión.');location.replace('/')}catch(err){error.textContent=err.message||'Error de conexión.';button.disabled=false;button.textContent='Entrar'}});
</script></body></html>
